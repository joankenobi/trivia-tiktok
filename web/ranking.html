<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia — récord de puntajes</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="bar">
  <h1>Trivia <span class="sub">récord de puntajes</span></h1>
  <div class="bar-right">
    <span id="conn" class="pill pill-idle">—</span>
    <a class="link" href="/control" target="_blank" rel="noopener">Consola del host ↗</a>
  </div>
</header>

<main>
  <section class="card">
    <div class="tally-head">
      <h2>Ranking</h2>
      <span class="label"><b id="players">0</b> jugadores</span>
    </div>
    <table class="rank">
      <thead><tr><th>#</th><th>Jugador</th><th>Aciertos</th><th>Puntos</th></tr></thead>
      <tbody id="rank-body"></tbody>
    </table>
    <p id="empty" class="hint hidden">Todavía no hay puntajes.</p>
  </section>
</main>

<script type="module" src="/js/ranking.js"></script>
</body>
</html>
